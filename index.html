<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/hero/hero.png" />
    <title>Андрей Чага — UX/UI Designer & Frontend Developer</title>
    <meta
      name="description"
      content="Проектирую цифровые продукты, которые решают бизнес-задачи и приносят удовольствие пользователям."
    />
    <style>
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #1e252f;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .preloader svg {
        width: 70%; /*тут были значения 180 и 90*/
        height: 70%;
        fill: none;
      }

      .preloader__line {
        animation: preloader-line 1.5s linear infinite;
      }

      .preloader--hidden {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes preloader-line {
        to {
          stroke-dashoffset: -6713px;
        }
      }
    </style>
  </head>
  <body>
    <div class="preloader" id="preloader" role="status" aria-label="Загрузка">
      <svg viewBox="-2000 -1000 4000 2000" aria-hidden="true">
        <path
          class="preloader__track"
          d="M354 -354 A500 500 0 1 1 354 354 L-354 -354 A500 500 0 1 0 -354 354 Z"
          fill="none"
          stroke="#00c2ff"
          stroke-width="400"
          stroke-linecap="round"
          opacity="0.3"
        ></path>
        <path
          class="preloader__line"
          d="M354 -354 A500 500 0 1 1 354 354 L-354 -354 A500 500 0 1 0 -354 354 Z"
          fill="none"
          stroke="#3282bd"
          stroke-width="400"
          stroke-linecap="round"
          stroke-dasharray="1570 5143"
        ></path>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
